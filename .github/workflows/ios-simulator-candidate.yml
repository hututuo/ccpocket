name: iOS Simulator candidate

on:
  push:
    branches: ['chore/cloud-handoff-*']
    paths: ['.github/workflows/ios-simulator-candidate.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    name: Package arm64 iOS Simulator app
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Read pinned Flutter version
        id: flutter
        run: echo "version=$(sed -n 's/^flutter = "\(.*\)"/\1/p' .mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - name: Verify message synchronization and presentation regressions
        working-directory: apps/mobile
        run: |
          dart format lib/features/chat_session/widgets/session_mode_bar.dart lib/features/chat_session/widgets/codex_settings_sheet.dart test/session_mode_bar_test.dart lib/features/conversation_content_sync/conversation_content_sync_service.dart lib/features/session_list/cache/session_catalog_cache_repository.dart test/features/conversation_content_sync/conversation_content_sync_service_test.dart lib/widgets/chat_input_bar.dart lib/hooks/use_scroll_tracking.dart lib/features/chat_session/widgets/maintain_reading_position_physics.dart lib/features/chat_session/widgets/reading_position_auto_scroll_controller.dart test/chat_input_bar_test.dart test/use_scroll_tracking_test.dart test/use_keyboard_scroll_adjustment_test.dart test/maintain_reading_position_physics_test.dart lib/features/chat_session/widgets/chat_message_list.dart lib/widgets/bubbles/tool_result_bubble.dart test/chat_message_list_process_disclosure_test.dart test/tool_result_bubble_test.dart
          git diff -- lib test > "$RUNNER_TEMP/settings-format.patch"
          dart analyze .
          flutter test test/session_mode_bar_test.dart test/chat_session_cubit_test.dart test/features/conversation_content_sync/conversation_content_sync_service_test.dart test/features/session_list/cache/session_catalog_cache_repository_test.dart test/chat_input_bar_test.dart test/use_scroll_tracking_test.dart test/use_keyboard_scroll_adjustment_test.dart test/maintain_reading_position_physics_test.dart test/chat_message_list_process_disclosure_test.dart test/chat_message_list_history_navigation_test.dart test/chat_session_local_history_paging_test.dart test/tool_result_bubble_test.dart --reporter expanded
      - name: Save formatting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-format-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/settings-format.patch
          if-no-files-found: warn
          retention-days: 14
      - name: Build simulator app
        working-directory: apps/mobile
        run: flutter build ios --simulator --debug
      - name: Audit and package simulator app
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          app=apps/mobile/build/ios/iphonesimulator/Runner.app
          root="$RUNNER_TEMP/ccpocket-simulator-candidate"
          mkdir -p "$root"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist" | grep -Fx com.k9i.ccpocket
          xcrun lipo -archs "$app/Runner" | grep -w arm64
          xcrun vtool -show-build "$app/Runner" > "$root/platform.txt"
          grep -q IOSSIMULATOR "$root/platform.txt"
          # Simulator keychain requires Xcode-generated embedded entitlements.
          xcrun otool -l "$app/Runner" > "$root/macho-load-commands.txt"
          grep -q __entitlements "$root/macho-load-commands.txt"
          codesign --verify --deep --strict "$app"
          tar -czf "$root/CC-Pocket-Simulator.tar.gz" -C apps/mobile/build/ios/iphonesimulator Runner.app
          python3 - <<'PY'
          import hashlib,json,os,plistlib,subprocess,tempfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'ccpocket-simulator-candidate'
          app=Path('apps/mobile/build/ios/iphonesimulator/Runner.app')
          info=plistlib.loads((app/'Info.plist').read_bytes())
          archive=root/'CC-Pocket-Simulator.tar.gz'
          patch=root/'build-source.patch'
          patch.write_bytes(subprocess.check_output(['git','diff','HEAD','--','apps/mobile']))
          with tempfile.TemporaryDirectory() as directory:
            env=dict(os.environ,GIT_INDEX_FILE=str(Path(directory)/'index'))
            subprocess.run(['git','read-tree','HEAD'],env=env,check=True)
            subprocess.run(['git','add','-u','--','apps/mobile'],env=env,check=True)
            tree=subprocess.check_output(['git','write-tree'],env=env,text=True).strip()
            build_mobile_tree=subprocess.check_output(['git','rev-parse',tree+':apps/mobile'],text=True).strip()
          manifest={'sourceSha':os.environ['SOURCE_SHA'],'runId':os.environ['RUN_ID'],
            'mobileTree':subprocess.check_output(['git','rev-parse','HEAD:apps/mobile'],text=True).strip(),
            'buildMobileTree':build_mobile_tree,'sourcePatchFile':patch.name,
            'sourcePatchSha256':hashlib.sha256(patch.read_bytes()).hexdigest(),
            'platform':'ios-simulator','buildMode':'debug','bundleId':info['CFBundleIdentifier'],
            'version':info['CFBundleShortVersionString'],'build':info['CFBundleVersion'],
            'fileName':archive.name,'bytes':archive.stat().st_size,'sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),
            'installStatus':'not_run'}
          (root/'candidate-manifest.json').write_text(json.dumps(manifest,indent=2)+chr(10))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ccpocket-ios-simulator-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ccpocket-simulator-candidate
          if-no-files-found: error
          retention-days: 14
